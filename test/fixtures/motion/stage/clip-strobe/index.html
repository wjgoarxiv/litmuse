<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #wall { position: absolute; inset: 0; }
  #line { position: absolute; left: 150px; top: 860px; margin: 0; z-index: 2; color: #f2f4f7; font: 700 64px Pretendard; }
</style>
</head>
<body>
<div id="wall"></div>
<p id="line"></p>
<script>
  const line = document.getElementById("line");
  line.textContent = "Lanterns drift home";
  LitStage.text(line);
  // A declared clip stretched over the whole frame, white on one frame and black on the next, looping.
  const play = LitStage.clip({ parent: document.getElementById("wall"), id: "strobe", box: { x: 0, y: 0, w: 1920, h: 1080 } });
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) { play(t, { start: 0, loop: true }); } });
</script>
</body>
</html>
