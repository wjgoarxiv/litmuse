<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #wall { position: absolute; inset: 0; }
  #line { position: absolute; left: 150px; top: 860px; margin: 0; color: #f2f4f7; font: 700 64px Pretendard; }
</style>
</head>
<body>
<div id="wall"></div>
<p id="line"></p>
<script>
  const line = document.getElementById("line");
  line.textContent = "Lanterns drift home";
  LitStage.text(line);
  // One keyed clip, cued at 1.0 s and played once; it holds its last frame until 1.5 s. Its frame follows t alone.
  const play = LitStage.clip({ parent: document.getElementById("wall"), id: "swatch", box: { x: 600, y: 300, w: 400, h: 300 } });
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) { play(t, { start: 1.0, hold: t < 1.5 }); } });
</script>
</body>
</html>
